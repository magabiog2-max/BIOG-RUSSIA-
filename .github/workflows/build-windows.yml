name: BIOG RUSSIA Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: electron-launcher-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-launcher-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows launcher
        run: npm run make

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BIOG-RUSSIA-CRMP-Windows
          path: electron-launcher-main/out/make/**/*
